name: r-ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'r/**'
      - 'analyses/**'
      - 'ops/r/**'
      - 'ops/ci/*analyses_guard.py'
      - 'ops/fly/postgres/**'
      - 'dbt/models/marts/**'
      - 'functions/src/mdp_functions/warehouse_lift.py'
      - 'control/packages/mdp-cli/**'
      - '.github/workflows/r-ci.yml'
  push:
    branches: [main]
    paths:
      - 'r/**'
      - 'analyses/**'
      - 'ops/r/**'
      - 'ops/ci/*analyses_guard.py'
      - 'ops/fly/postgres/**'
      - 'dbt/models/marts/**'
      - 'functions/src/mdp_functions/warehouse_lift.py'
      - 'control/packages/mdp-cli/**'
      - '.github/workflows/r-ci.yml'
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MDP_R_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git branch main origin/main || true
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL 17 clients and tmux
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/postgresql.asc >/dev/null
          source /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 tmux
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: python3 ops/ci/analyses_guard.py
      - run: WITH_PG_LAKE=0 bash ops/local/up.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mdp-r/renv
          key: r-renv-${{ runner.os }}-${{ hashFiles('ops/r/Dockerfile', '**/renv.lock') }}
      - run: bash ops/r/check.sh --smoke
      - run: bash ops/local/down.sh
        if: always()
