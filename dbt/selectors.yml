selectors:
  - name: hourly_global_bronze
    definition:
      intersection:
        - {method: tag, value: "cadence:hourly"}
        - {method: tag, value: "scope:global"}
        - {method: tag, value: bronze}
        - union:
            - {method: tag, value: export}
            - {method: tag, value: invoke}
            - {method: tag, value: close}
  - name: hourly_global_transform
    definition:
      intersection:
        - {method: tag, value: "cadence:hourly"}
        - {method: tag, value: "scope:global"}
        - exclude:
            - {method: selector, value: hourly_global_bronze}
  - name: hourly_tenant_bronze
