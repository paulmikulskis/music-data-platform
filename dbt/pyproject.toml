[project]
name = "music-data-platform"
version = "0.0.1"
description = "dbt transformations for the Music Data Platform."
requires-python = ">=3.10,<3.14"
dependencies = [
  "dbt-core>=1.12,<2.0",
  "dbt-duckdb>=1.10",
  "dbt-postgres>=1.9",
  "duckdb>=1.3",
]

[project.optional-dependencies]
snowflake = ["dbt-snowflake>=1.9"]

[tool.uv]
package = false
