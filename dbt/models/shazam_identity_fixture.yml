- name: shazam_markets_use_iso_and_exclude_worldwide
  model: mart_shazam_chart_daily
  config: *id001
  overrides:
    vars:
      cycle_opened_at: '2026-09-26 12:00:00'
      dry_run: true
    macros:
      mdp_annotate: select * from annotated
  given:
  - input: ref('stg_shazam__chart_entries')
    rows:
    - chart: fixture-0
      chart_type: top-200
      country: united-kingdom
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '0'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
    - chart: fixture-1
      chart_type: top-200
      country: UNITED-STATES
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '1'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
    - chart: fixture-2
      chart_type: top-200
      country: GB
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '2'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
    - chart: fixture-3
      chart_type: top-200
      country: world
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '3'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
    - chart: fixture-4
      chart_type: top-200
      country: GLOBAL
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '4'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
    - chart: fixture-5
      chart_type: top-200
      country: unknown-place
      chart_date: '2026-09-26'
      position: 1
      apple_song_id: '5'
      observed_at: '2026-09-26 12:00:00'
      _source_key: sz_chart
  - input: ref('int_track_identity__daily')
    rows: []
  - input: ref('shazam_markets')
    rows:
    - slug: united-kingdom
      country: GB
    - slug: united-states
      country: US
  - input: ref('rights_registry')
    rows:
    - source_key: sz_chart
      learning_eligible: false
      resale_permitted: false
  expect:
    rows:
    - chart: fixture-0
      country: GB
    - chart: fixture-1
      country: US
    - chart: fixture-2
      country: GB
    - chart: fixture-3
      country: null
    - chart: fixture-4
      country: null
    - chart: fixture-5
      country: null
- name: apple_successor_flag_off
  model: int_song_cluster__daily
  config: *id001
  overrides: *id002
  given:
  - input: ref('int_song_cluster_inputs__daily')
    rows: []
  - input: ref('int_song_key__daily')
    rows:
    - song_key: a
      resolved: false
      source_keys: '["sz_chart"]'
    - song_key: b
      resolved: false
      source_keys: '["sz_chart"]'
  - input: ref('int_song_cluster_edges__daily')
    rows:
    - left_key: a
      right_key: b
      method: apple_id_successor
      basis: chart_replacement
  - input: ref('song_cluster_rules')
    rows:
    - method: apple_id_successor
      enabled: false
      confidence: 1.0
  - input: ref('int_song_group_evidence__daily')
    rows:
    - song_key: a
      evidence_count: 2
    - song_key: b
      evidence_count: 1
  expect:
    rows:
    - song_key: a
      cluster_key: a
      cluster_methods: '[]'
    - song_key: b
      cluster_key: b
      cluster_methods: '[]'
- name: apple_successor_flag_on
  model: int_song_cluster__daily
  config: *id001
  overrides: *id002
  given:
  - input: ref('int_song_cluster_inputs__daily')
    rows: []
  - input: ref('int_song_key__daily')
    rows:
    - song_key: a
      resolved: false
      source_keys: '["sz_chart"]'
    - song_key: b
      resolved: false
      source_keys: '["sz_chart"]'
  - input: ref('int_song_cluster_edges__daily')
    rows:
    - left_key: a
      right_key: b
      method: apple_id_successor
      basis: chart_replacement
  - input: ref('song_cluster_rules')
    rows:
    - method: apple_id_successor
      enabled: true
      confidence: 1.0
  - input: ref('int_song_group_evidence__daily')
    rows:
    - song_key: a
      evidence_count: 2
    - song_key: b
      evidence_count: 1
  expect:
    rows:
    - song_key: a
      cluster_key: a
      cluster_methods: '["apple_id_successor"]'
    - song_key: b
      cluster_key: a
      cluster_methods: '["apple_id_successor"]'
