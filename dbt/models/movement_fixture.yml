- name: song_stage_waits_for_every_credited_artist
  model: int_song_age__daily
  description: A song takes its most established credited artist, so "A feat. B" reads established when B is. It
    stays unknown while any credited artist has no lookup, so "A feat. B" with B unread never reads emerging. A
    special purpose artist is read but sets no stage.
  config:
    tags:
    - song_fixture
  overrides:
    vars:
      cycle_opened_at: '2026-09-25 12:00:00'
      dry_run: true
    macros: {}
  given:
  - input: ref('int_song_key__daily')
    rows:
