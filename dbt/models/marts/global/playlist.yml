    - type: not_null
  - name: occurrence_inferred
    description: "True when repeated copies of an item are distinguished by their observed order rather than a stable platform row identifier."
    data_type: boolean
  - name: interval_id
    description: "Snapshot identifier that starts one membership island, a run of sightings with no complete observation proving absence between them."
    data_type: text
  - name: position
    description: "One-based position at this item's latest sighting within its still-open membership island."
    data_type: bigint
  - name: platform_track_id
    description: "Track identifier on the platform, null for an item representing a release rather than a track."
    data_type: text
  - name: item_type
    description: "Kind of playlist item, distinguishing a track from a release such as an album."
    data_type: text
  - name: platform_item_id
    description: "Platform identifier of the playlist item itself, whether that item is a track or a release."
    data_type: text
  - name: featured_track_id
    description: "Platform identifier of a track featured for a release item, which does not make the whole release a track list membership."
    data_type: text
  - name: observed_at
    description: "UTC time of the selected stream's latest snapshot, which may carry forward an earlier item sighting when no complete absence closes its island."
    data_type: timestamp
  - name: coverage
    description: "Full means the collected stream passes completeness checks even when a head covers only part of the playlist, while partial or simultaneous snapshots prove presence only."
    data_type: text
  - name: extent
    description: "Full means the selected surface covers the whole list, while head_only limits membership claims to its visible beginning regardless of coverage."
    data_type: text
  - name: snapshot_id
    description: "Identifier of the selected stream's latest snapshot, which need not contain a fresh sighting of every carried-forward member."
    data_type: text
  - name: learning_eligible
    description: "True only when the contributing source permissions allow learning from this row, with unknown permission treated as false."
    data_type: boolean
    data_tests:
    - not_null
  - name: resale_permitted
    description: "True only when the contributing source permissions allow resale of this row, with unknown permission treated as false."
    data_type: boolean
    data_tests:
    - not_null
  - name: source_keys
    description: "JSON array of contributing source identifiers used to attach permissions without removing the row."
    data_type: text
    data_tests:
    - not_null
