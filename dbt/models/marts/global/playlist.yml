    data_type: bigint
  - name: follower_change
    description: "Follower count minus the previous snapshot's count in this playlist variant and stream, null when either count is missing and not a fixed-day change."
    data_type: bigint
  - name: track_count_reported
    description: "Playlist size reported by the platform, using the paired page total for a head stream and null when unavailable."
