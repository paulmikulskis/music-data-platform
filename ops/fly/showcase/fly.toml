app = "mdp-showcase"
primary_region = "ewr"
[build]
  dockerfile = "../../../control/apps/showcase/Dockerfile"
[env]
  NODE_ENV = "production"
  MDP_SHOWCASE_INVENTORY_ENABLED = "1"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
